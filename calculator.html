<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="calcuator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator-container">
    <div class="display-container">
      <div id="expression" class="expression-display"></div>
      <div id="result" class="result-display">0</div>
    </div>

    <!-- Keypad Grid (Clean 4x5 Layout) -->
    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn function-btn" data-action="clear">AC</button>
      <button class="btn function-btn" data-action="delete">⌫</button>
      <button class="btn function-btn" data-action="percent">%</button>
      <button class="btn operator-btn" data-operator="÷">÷</button>

      <!-- Row 2 -->
      <button class="btn number-btn" data-value="7">7</button>
      <button class="btn number-btn" data-value="8">8</button>
      <button class="btn number-btn" data-value="9">9</button>
      <button class="btn operator-btn" data-operator="×">×</button>

      <!-- Row 3 -->
      <button class="btn number-btn" data-value="4">4</button>
      <button class="btn number-btn" data-value="5">5</button>
      <button class="btn number-btn" data-value="6">6</button>
      <button class="btn operator-btn" data-operator="−">−</button>

      <!-- Row 4 -->
      <button class="btn number-btn" data-value="1">1</button>
      <button class="btn number-btn" data-value="2">2</button>
      <button class="btn number-btn" data-value="3">3</button>
      <button class="btn operator-btn" data-operator="+">+</button>

      <!-- Row 5 -->
      <button class="btn function-btn" data-action="toggle-sign">±</button>
      <button class="btn number-btn" data-value="0">0</button>
      <button class="btn number-btn" data-value=".">.</button>
      <button class="btn equals-btn" id="equals-btn">=</button>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
